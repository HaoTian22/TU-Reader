services:
  feedback:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    user: "${PUID:?Set PUID in server/.env}:${PGID:?Set PGID in server/.env}"
    ports:
      - "${FEEDBACK_PORT:-8010}:8000"
    environment:
      FEEDBACK_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 10s
