plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'com.google.devtools.ksp'
}

// 签名：本地读根目录 keystore.properties，CI 读环境变量；两者都没有则退回 debug 签名
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseKeystoreConfigured = keystorePropertiesFile.exists() || System.getenv('KEYSTORE_FILE') != null

// 腾讯地图 WebService：CI 环境变量优先，本地开发读取被 Git 忽略的 local.properties。
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def readTencentMapCredential = { String name ->
    def environmentValue = System.getenv(name)?.trim()
    environmentValue ? environmentValue : localProperties.getProperty(name, '').trim()
}
def buildConfigString = { String value ->
    def escaped = value
        .replace('\\', '\\\\')
        .replace('"', '\\"')
        .replace('\r', '\\r')
        .replace('\n', '\\n')
    "\"${escaped}\""
}
def tencentMapWebServiceKey = readTencentMapCredential('TENCENT_MAP_WEB_SERVICE_KEY')
def tencentMapSecretKey = readTencentMapCredential('TENCENT_MAP_SECRET_KEY')
def feedbackUploadUrl = System.getenv('FEEDBACK_UPLOAD_URL')?.trim() ?: localProperties.getProperty('FEEDBACK_UPLOAD_URL', '').trim()

def appVersionName = project.findProperty('versionName') ?: '1.0.0'

android {
    namespace 'com.example.nfctransit'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.nfctransit"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName appVersionName
        resValue "string", "app_version", appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "TENCENT_MAP_WEB_SERVICE_KEY", buildConfigString(tencentMapWebServiceKey)
        buildConfigField "String", "TENCENT_MAP_SECRET_KEY", buildConfigString(tencentMapSecretKey)
        buildConfigField "String", "FEEDBACK_UPLOAD_URL", buildConfigString(feedbackUploadUrl)
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    ksp {
        arg("room.schemaLocation", "$projectDir/schemas")
    }

    signingConfigs {
        release {
            if (releaseKeystoreConfigured) {
                storeFile file(System.getenv('KEYSTORE_FILE') ?: keystoreProperties['storeFile'])
                storePassword System.getenv('KEYSTORE_PASSWORD') ?: keystoreProperties['storePassword']
                keyAlias System.getenv('KEY_ALIAS') ?: keystoreProperties['keyAlias']
                keyPassword System.getenv('KEY_PASSWORD') ?: keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseKeystoreConfigured) {
                signingConfig signingConfigs.release
            } else {
                // 未配置 keystore：退回 debug 签名以便安装
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.8'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.8'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'

    // Fragment
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    // ViewPager2 for card carousel
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // JSON 序列化（数据导出）
    implementation 'com.google.code.gson:gson:2.10.1'

    // DataStore（轻量 UI/设置状态）
    implementation 'androidx.datastore:datastore-preferences:1.1.7'

    // Room（站点/线路映射数据库）
    implementation 'androidx.room:room-runtime:2.8.4'
    implementation 'androidx.room:room-ktx:2.8.4'
    ksp 'androidx.room:room-compiler:2.8.4'

    // 腾讯地图 SDK（4.5.x 兼容经典 5 段式 Key 格式，自包含无传递依赖）
    implementation 'com.tencent.map:tencent-map-vector-sdk:4.5.14.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
